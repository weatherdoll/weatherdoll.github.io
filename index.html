<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deltarune Tree</title>
    <style>
        /* Import the custom pixel font file from your repository */
        @font-face {
            font-family: 'DotumChePixel';
            src: url('dotumche.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* Force full screen layout with black background */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000 !important;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Container shifts layout direction to column to cleanly stack content */
        .page-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            max-width: 90vw;
            max-height: 95vh;
        }

        /* Responsive constraints for the layout engine */
        .centered-gif {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            display: block;
        }

        /* Pixel art font styling rules */
        .pixel-text {
            font-family: 'DotumChePixel', 'Courier New', monospace;
            color: #ffffff;
            font-size: 24px;
            margin-top: 20px;
            letter-spacing: 1px;
            image-rendering: pixelated; /* Forces rendering engine to stay crisp */
        }
    </style>
</head>
<body>

    <div class="page-container">
        <!-- Your centered gif file -->
        <img src="deltarune-tree.gif" alt="Deltarune Tree Animation" class="centered-gif">
        
        <!-- Your pixel text caption wrapper -->
        <div class="pixel-text">
            Type your custom text here...
        </div>
    </div>

</body>
</html>
