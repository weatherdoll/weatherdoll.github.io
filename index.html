<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <style>
        /* Resets margins and fills the whole screen */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            /* Flexbox perfectly centers the content horizontally and vertically */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; 
        }

        /* Makes sure the GIF scales dynamically and stays crisp on mobile and desktop */
        .centered-gif {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <!-- REPLACE THE LINK BELOW WITH YOUR OWN GIF LINK -->
    <img src="deltarune-tree.gif" alt="Centered GIF" class="centered-gif">


</body>
</html>
