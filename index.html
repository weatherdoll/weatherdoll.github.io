<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deltarune Tree</title>
    <style>
        /* Force the page to fill the entire screen and stay black */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000 !important;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Responsive layout container for mobile and desktop screens */
        .gif-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        /* Keeps the GIF scaled, centered, and crisp across devices */
        .centered-gif {
            max-width: 90vw;
            max-height: 90vh;
            object-fit: contain;
        }
    </style>
</head>
<body>

    <div class="gif-container">
        <!-- Points directly to your uploaded file -->
        <img src="deltarune-tree.gif" alt="Deltarune Tree Animation" class="centered-gif">
    </div>

</body>
</html>
