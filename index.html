<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deltarune Tree</title>
    <style>
        @font-face {
            font-family: 'DotumChePixel';
            src: url('dotumche.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000 !important;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Invisible click zones placed in all 4 corners of the screen */
        .secret-corner {
            position: absolute;
            width: 100px;
            height: 100px;
            z-index: 10;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        #top-left     { top: 0; left: 0; }
        #top-right    { top: 0; right: 0; }
        #bottom-left  { bottom: 0; left: 0; }
        #bottom-right { bottom: 0; right: 0; }

        .page-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            max-width: 90vw;
            max-height: 95vh;
            z-index: 1;
        }

        .centered-gif {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            display: block;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .pixel-text {
            font-family: 'DotumChePixel', 'Courier New', monospace;
            color: #ffffff;
            font-size: 24px;
            margin-top: 20px;
            letter-spacing: 1px;
            image-rendering: pixelated;
            user-select: none;
        }
    </style>
</head>
<body>

    <!-- 4 Secret Invisible Corner Click Zones -->
    <div id="top-left" class="secret-corner"></div>
    <div id="top-right" class="secret-corner"></div>
    <div id="bottom-left" class="secret-corner"></div>
    <div id="bottom-right" class="secret-corner"></div>

    <div class="page-container">
        <img id="interactive-gif" src="deltarune-tree.gif" alt="Deltarune Tree Animation" class="centered-gif">
        <div class="pixel-text">
            * (Well, there is a man here.)
        </div>
    </div>

    <script>
        // -------------------------------------------------------------
        // UNSTOPPABLE AUDIO STREAM LAYOUT
        // -------------------------------------------------------------
        const weightedPool = [
            'music.ogg', 'music.ogg', 'music.ogg', 'music.ogg', 
            'music.ogg', 'music.ogg', 'music.ogg', 'music.ogg', 
            'music2.ogg', 'music3.ogg'
        ];
        const randomSong = weightedPool[Math.floor(Math.random() * weightedPool.length)];
        const audio = new Audio(randomSong);
        audio.loop = true;
        audio.load();

        const gifButton = document.getElementById('interactive-gif');
        let audioStarted = false;

        function startAudioEngine() {
            if (!audioStarted) {
                audio.play().then(() => {
                    audioStarted = true;
                    gifButton.style.cursor = 'default';
                }).catch(err => console.log(err));
            }
        }

        // Keep audio running unpaused 
        audio.addEventListener('pause', () => audio.play().catch(e => console.log(e)));

        // -------------------------------------------------------------
        // SECRET GATEWAY TRIGGERS
        // -------------------------------------------------------------
        const subpageUrl = "secret.html";

        // Trigger 1: Clicking the GIF has a 1% chance to teleport to subpage
        gifButton.addEventListener('click', (e) => {
            e.preventDefault();
            startAudioEngine(); // Still starts music on first click
            
            if (Math.random() < 0.01) { // 0.01 = 1% probability match
                window.location.href = subpageUrl;
            }
        });
        gifButton.addEventListener('touchstart', (e) => {
            e.preventDefault();
            startAudioEngine();
            if (Math.random() < 0.01) {
                window.location.href = subpageUrl;
            }
        }, { passive: false });

        // Trigger 2: Clicking any corner has a 10% chance to teleport
        function handleCornerClick(e) {
            e.preventDefault();
            if (Math.random() < 0.10) { // 0.10 = 10% probability match
                window.location.href = subpageUrl;
            }
        }
        ['top-left', 'top-right', 'bottom-left', 'bottom-right'].forEach(id => {
            const corner = document.getElementById(id);
            corner.addEventListener('click', handleCornerClick);
            corner.addEventListener('touchstart', handleCornerClick, { passive: false });
        });

        // Trigger 3: Typing "MANCOUNTRY" in all caps on keyboard
        let typedKeys = "";
        window.addEventListener('keydown', (e) => {
            // Unstoppable spacebar check
            if (e.code === 'Space' || e.keyCode === 32) {
                e.preventDefault();
                audio.play().catch(e => console.log(e));
                return;
            }

            // Capitalize input and look for exact tracking matches
            const key = e.key;
            if (key.length === 1) { 
                typedKeys += key;
                // Keep only the length of the string we care about to save phone memory
                if (typedKeys.length > 10) {
                    typedKeys = typedKeys.substring(typedKeys.length - 10);
                }
                
                if (typedKeys === "MANCOUNTRY") {
                    window.location.href = subpageUrl;
                }
            }
        });

        // Trigger 4: Automatic transfer after exactly 11 minutes (660,000 milliseconds)
        setTimeout(() => {
            window.location.href = subpageUrl;
        }, 11 * 60 * 1000);
    </script>

</body>
</html>
