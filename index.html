<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deltarune Tree</title>
    <style>
        /* Import custom pixel font file from repository */
        @font-face {
            font-family: 'DotumChePixel';
            src: url('dotumche.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* Force full-screen layout with black background */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000 !important;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Container shifts layout direction to column to cleanly stack content */
        .page-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            max-width: 90vw;
            max-height: 95vh;
        }

        /* Responsive constraints for the layout engine */
        .centered-gif {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            display: block;
            cursor: pointer;
        }

        /* Pixel art font styling rules */
        .pixel-text {
            font-family: 'DotumChePixel', 'Courier New', monospace;
            color: #ffffff;
            font-size: 24px;
            margin-top: 20px;
            letter-spacing: 1px;
            image-rendering: pixelated;
            user-select: none;
        }
    </style>
</head>
<body>

    <!-- Hidden loop player with controls completely blocked -->
    <audio id="bg-music" src="music.ogg" loop preload="auto"></audio>

    <div class="page-container">
        <!-- The interactive GIF target -->
        <img id="interactive-gif" src="deltarune-tree.gif" alt="Deltarune Tree Animation" class="centered-gif">
        
        <!-- Static text caption wrapper -->
        <div class="pixel-text">
            * (Well, there is a man here.)
        </div>
    </div>

    <script>
        const audio = document.getElementById('bg-music');
        const gifButton = document.getElementById('interactive-gif');

        function activateInteractiveGif() {
            // 1. Kick off the unstoppable audio engine
            audio.muted = false;
            audio.play().catch(e => console.log(e));

            // 2. Remove the pointer cursor from the GIF
            gifButton.style.cursor = 'default';

            // 3. Destroy the listener completely so future clicks don't disrupt the track
            gifButton.removeEventListener('click', activateInteractiveGif);
            gifButton.removeEventListener('touchstart', activateInteractiveGif);
        }

        // Listens for clicks/taps ONLY when interacting directly with the GIF image
        gifButton.addEventListener('click', activateInteractiveGif);
        gifButton.addEventListener('touchstart', activateInteractiveGif);

        // Unstoppable protection guardrail loop
        audio.addEventListener('pause', () => {
            audio.play().catch(e => console.log("Overriding pause command:", e));
        });

        // Prevent spacebar or keyboard shortcuts from pausing the audio stream
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.keyCode === 32) {
                e.preventDefault(); 
                audio.play().catch(e => console.log(e));
            }
        });
    </script>

</body>
</html>
