<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Room</title>
    <style>
        /* Import custom pixel font file from repository */
        @font-face {
            font-family: 'DotumChePixel';
            src: url('dotumche.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        /* Force full-screen layout with black background */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000 !important;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Container shifts layout direction to column to cleanly stack content */
        .page-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            max-width: 90vw;
            max-height: 95vh;
        }

        /* Responsive constraints for the layout engine */
        .centered-gif {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            display: block;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        /* Pixel art font styling rules */
        .pixel-text {
            font-family: 'DotumChePixel', 'Courier New', monospace;
            color: #ffffff;
            font-size: 24px;
            margin-top: 20px;
            letter-spacing: 1px;
            image-rendering: pixelated;
            user-select: none;
            min-height: 35px;
        }
    </style>
</head>
<body>

    <div class="page-container">
        <!-- Remember to change 'secret-asset.gif' to your actual subpage GIF file name -->
        <img id="interactive-gif" src="secret-asset.gif" alt="Secret Room Animation" class="centered-gif">
        
        <!-- The dynamic text container -->
        <div id="text-prompt" class="pixel-text">
                 
        </div>
    </div>

    <script>
        // 1. Initialize custom background track
        const audio = new Audio('music4.ogg');
        audio.loop = true;
        audio.load();

        const gifButton = document.getElementById('interactive-gif');
        const textPrompt = document.getElementById('text-prompt');
        
        let audioStarted = false;
        let dialogueIndex = 0;

        // 2. Your custom dialogue list with asterisks included
        const dialogueList = [
            "* WELL,",
            "* SPRING CHANGED TO SUMMER,",
            "* AND SUMMER CHANGED TO COLD,",
            "* AND SURE ENOUGH,",
            "* I AM THE FORGOTTEN MAN."
        ];

        function handleInteraction(e) {
            e.preventDefault();

            // Start the unstoppable audio track on the very first interaction
            if (!audioStarted) {
                audio.play().catch(err => console.log("Audio start error:", err));
                audioStarted = true;
            }

            // Step through dialogue frames one by one
            if (dialogueIndex < dialogueList.length) {
                textPrompt.innerHTML = dialogueList[dialogueIndex];
                dialogueIndex++;
            } else {
                // Dialogue has ended. Hide the text container completely.
                textPrompt.innerHTML = "";
                textPrompt.style.display = "none"; 
            }
        }

        // Bind cleanly to screen interaction contexts
        gifButton.addEventListener('click', handleInteraction);
        gifButton.addEventListener('touchstart', handleInteraction, { passive: false });

        // Unstoppable protection guardrail loop
        audio.addEventListener('pause', () => {
            audio.play().catch(e => console.log("Overriding pause command:", e));
        });

        // Prevent spacebar or keyboard shortcuts from pausing the audio stream
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.keyCode === 32) {
                e.preventDefault(); 
                audio.play().catch(e => console.log(e));
            }
        });
    </script>

</body>
</html>
