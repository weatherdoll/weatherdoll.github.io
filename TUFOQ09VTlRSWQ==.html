<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ㅤㅤㅤㅤㅤ</title>
    <style>
        @font-face {
            font-family: 'DotumChePixel';
            src: url('dotumche.ttf') format('truetype');
            font-weight: normal;
            font-style: normal;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000 !important;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .page-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            max-width: 90vw;
            max-height: 95vh;
        }

        .centered-gif {
            max-width: 100%;
            max-height: 70vh;
            object-fit: contain;
            display: block;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        .pixel-text {
            font-family: 'DotumChePixel', 'Courier New', monospace;
            color: #ffffff;
            font-size: 24px;
            margin-top: 20px;
            letter-spacing: 1px;
            image-rendering: pixelated;
            user-select: none;
            min-height: 35px;
        }
    </style>
</head>
<body>

    <div class="page-container">
        <img id="interactive-gif" src="secret-asset.gif" alt="Secret Room Animation" class="centered-gif">
        <div id="text-prompt" class="pixel-text">
            ㅤㅤㅤㅤㅤ
        </div>
    </div>

    <!-- Hidden audio element explicitly defined for the audio system context graph -->
    <audio id="bg-track" src="music4.ogg" loop preload="auto" crossorigin="anonymous"></audio>

    <script>
        const audioElement = document.getElementById('bg-track');
        const gifButton = document.getElementById('interactive-gif');
        const textPrompt = document.getElementById('text-prompt');
        
        let audioContextInitialized = false;
        let dialogueIndex = 0;

        const dialogueList = [
            "* WELL,",
            "* SPRING CHANGED TO SUMMER, AND SUMMER CHANGED TO COLD,",
            "* AND SURE ENOUGH,",
            "* I AM THE FORGOTTEN MAN."
        ];

        function handleInteraction(e) {
            e.preventDefault();

            // Web Audio API Pipeline Activation Layer
            if (!audioContextInitialized) {
                try {
                    // Instantiates or resumes the system audio stream graph container
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    const audioCtx = new AudioContext();
                    
                    // Creates an interface route tying the audio element directly to the device sound card
                    const source = audioCtx.createMediaElementSource(audioElement);
                    source.connect(audioCtx.destination);
                    
                    if (audioCtx.state === 'suspended') {
                        audioCtx.resume(); // Explicitly unlocks mobile sound processor pipeline
                    }
                } catch(err) {
                    console.log("AudioContext routing initialized implicitly or active.");
                }

                // Fire the playback engine
                audioElement.play().catch(err => console.log("Playback error:", err));
                audioContextInitialized = true;
            }

            // Step through dialogue frames
            if (dialogueIndex < dialogueList.length) {
                textPrompt.innerHTML = dialogueList[dialogueIndex];
                dialogueIndex++;
            } else {
                textPrompt.innerHTML = "";
                textPrompt.style.display = "none"; 
            }
        }

        // Bind directly to desktop clicks and physical mobile touch layouts
        gifButton.addEventListener('click', handleInteraction, { passive: false });
        gifButton.addEventListener('touchstart', handleInteraction, { passive: false });

        // Unstoppable protection guardrail loop
        audioElement.addEventListener('pause', () => {
            audioElement.play().catch(e => console.log(e));
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.keyCode === 32) {
                e.preventDefault(); 
                audioElement.play().catch(e => console.log(e));
            }
        });
    </script>

</body>
</html>
